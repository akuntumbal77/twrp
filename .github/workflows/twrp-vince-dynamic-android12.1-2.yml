name: twrp-vince-dynamic-android12.1

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          tools-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: true

      - name: Check Disk Space (after reclaim)
        run: df -h

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 4

      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Telegram - Build Started
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          BUILD_DATE=$(date +"%Y-%m-%d %H:%M:%S UTC")
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="🔨 *TWRP Build Started (Dynamic Partition)*
            📱 *Device:* Xiaomi Redmi 5 Plus (vince) - mi8953
            🌿 *Branch:* android-12.1 (patched: super/dynamic)
            🕒 *Time:* ${BUILD_DATE}
            🔗 [GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

      - name: Install Packages
        run: |
          sudo apt-get update -y 2>&1 | tee -a /tmp/full_build.log
          sudo apt-get install -y --no-install-recommends \
            git curl wget zip unzip cpio bzip2 zstd lzop \
            make python3 bc flex bison gperf gawk \
            libxml2-utils xsltproc libssl-dev \
            build-essential ccache 2>&1 | tee -a /tmp/full_build.log
          # Bersihkan apt cache setelah install, lumayan buat disk
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Setup Repo Tool
        run: |
          git config --global user.name "RahmatSobrian"
          git config --global user.email "build@relife.local"
          git config --global color.ui false
          mkdir -p ~/bin
          curl -o ~/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Notify Telegram - Syncing Sources
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="🔄 *Syncing TWRP Sources...*
            📦 Manifest: minimal-manifest-twrp (twrp-12.1)
            ⚙️ Harap tunggu..."

      - name: Init & Sync TWRP Manifest
        run: |
          mkdir -p twrp
          cd twrp

          repo init \
            --depth=1 \
            --groups=default,-mips,-x86,-darwin \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1 \
            2>&1 | tee -a /tmp/full_build.log

          repo sync \
            -j$(nproc --all) \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            2>&1 | tee -a /tmp/full_build.log

          rm -rf .repo
          df -h | tee -a /tmp/full_build.log

      - name: Check Disk Space (after repo sync)
        run: df -h

      - name: Clone Device Tree (vince)
        run: |
          cd twrp
          git clone --depth=1 \
            https://github.com/Project-Nightcord/twrp_device_xiaomi_vince.git \
            -b android-12.1 \
            device/xiaomi/vince \
            2>&1 | tee -a /tmp/full_build.log

      # =====================================================================
      # PENTING: Nilai BOARD_SUPER_PARTITION_SIZE di bawah ini PLACEHOLDER.
      # Wajib disesuaikan dengan ukuran "super" milik ROM kamu:
      #   1. Buka device tree ROM: github.com/Project-Nightcord/android_device_xiaomi_vince
      #      branch lineage-22.2 -> file BoardConfig.mk
      #   2. Cari baris BOARD_SUPER_PARTITION_SIZE dan BOARD_SUPER_PARTITION_GROUPS
      #      lalu salin nilainya persis ke sini (ganti angka di bawah).
      #   3. Kalau ROM kamu juga punya partisi system_ext/product terpisah,
      #      pastikan namanya cocok dengan BOARD_..._PARTITION_LIST di bawah.
      # =====================================================================
      - name: Patch Device Tree for Dynamic Partition (Super) Support
        run: |
          cd twrp/device/xiaomi/vince
          set -e

          echo "== Patch BoardConfig.mk =="
          # Hapus baris size statis system/vendor lama (sudah tidak relevan, jadi logical di super)
          # BOARD_VENDORIMAGE_FILE_SYSTEM_TYPE dihapus di sini supaya tidak dobel -
          # nanti ditambahkan lagi di blok dynamic partition di bawah.
          sed -i '/BOARD_SYSTEMIMAGE_PARTITION_SIZE/d;/BOARD_VENDORIMAGE_PARTITION_SIZE/d;/BOARD_VENDORIMAGE_FILE_SYSTEM_TYPE/d' BoardConfig.mk

          cat >> BoardConfig.mk << 'EOF'

          # ==== Dynamic Partitions (retrofit super) - vince/mi8953 ====
          # Nilai di bawah disalin persis dari BoardConfig.mk device tree ROM
          # (Project-Nightcord/android_device_xiaomi_vince, branch lineage-22.2).
          # Device ini TIDAK punya partisi fisik "super" tersendiri - metadata
          # dynamic partition menumpang di partisi fisik lama "cust" dan "system".
          BOARD_SUPER_PARTITION_BLOCK_DEVICES := cust system
          BOARD_SUPER_PARTITION_METADATA_DEVICE := system
          BOARD_SUPER_PARTITION_CUST_DEVICE_SIZE := 536870912
          BOARD_SUPER_PARTITION_SYSTEM_DEVICE_SIZE := 3221225472
          BOARD_SUPER_PARTITION_SIZE := $(shell expr $(BOARD_SUPER_PARTITION_CUST_DEVICE_SIZE) + $(BOARD_SUPER_PARTITION_SYSTEM_DEVICE_SIZE) )

          BOARD_SUPER_PARTITION_GROUPS := mi8953_dynpart
          BOARD_MI8953_DYNPART_SIZE := $(shell expr $(BOARD_SUPER_PARTITION_SIZE) - 4194304 )
          BOARD_MI8953_DYNPART_PARTITION_LIST := product system system_ext odm vendor

          TARGET_COPY_OUT_PRODUCT := product
          TARGET_COPY_OUT_SYSTEM_EXT := system_ext
          TARGET_COPY_OUT_VENDOR := vendor
          TARGET_COPY_OUT_ODM := odm

          # WAJIB: build system minta filesystem type tiap partisi didefinisikan,
          # meskipun runtime-nya jadi logical partition di dalam super.
          # (Ini yang kelupaan di percobaan pertama - bikin build gagal dengan error
          # "either BOARD_PREBUILT_PRODUCTIMAGE or BOARD_PRODUCTIMAGE_FILE_SYSTEM_TYPE must be set")
          BOARD_VENDORIMAGE_FILE_SYSTEM_TYPE := ext4
          BOARD_PRODUCTIMAGE_FILE_SYSTEM_TYPE := ext4
          BOARD_SYSTEM_EXTIMAGE_FILE_SYSTEM_TYPE := ext4
          BOARD_ODMIMAGE_FILE_SYSTEM_TYPE := ext4

          # TWRP: aktifkan dukungan mount partisi logical
          TW_INCLUDE_LOGICAL := true
          EOF

          # CATATAN: device ini RETROFIT dynamic partition (tidak ada partisi fisik
          # "super" tersendiri - metadata numpang di partisi fisik "cust" & "system",
          # lihat BOARD_SUPER_PARTITION_BLOCK_DEVICES di atas). fs_mgr menemukan
          # kedua block device itu otomatis lewat metadata, TIDAK perlu entry /super
          # terpisah di fstab. Entry di bawah ini best-effort berdasarkan
          # BOARD_MI8953_DYNPART_PARTITION_LIST (product system system_ext odm vendor).
          # Kalau kamu punya file rootdir/etc/fstab.qcom dari device tree ROM,
          # kirimkan supaya ini bisa disesuaikan 1:1 dengan punya ROM.

          echo "== Patch twrp.fstab (root/system/etc/twrp.fstab) =="
          FSTAB=recovery/root/system/etc/twrp.fstab
          # Hapus baris system/system_image/vendor/vendor_image lama
          sed -i '/^\/system /d;/^\/system_image /d;/^\/vendor /d;/^\/vendor_image /d' "$FSTAB"

          cat >> "$FSTAB" << 'EOF'
          /system          ext4   /dev/block/mapper/system                                flags=logical;display="System";backup=1;flashimg=1
          /vendor          ext4   /dev/block/mapper/vendor                                flags=logical;display="Vendor";backup=1;flashimg=1
          /product         ext4   /dev/block/mapper/product                               flags=logical;display="Product";backup=1;flashimg=1
          /system_ext      ext4   /dev/block/mapper/system_ext                            flags=logical;display="System_ext";backup=1;flashimg=1
          /odm             ext4   /dev/block/mapper/odm                                   flags=logical;display="Odm";backup=1;flashimg=1
          EOF

          echo "== Patch recovery.fstab (root/system/etc/recovery.fstab) =="
          RFSTAB=recovery/root/system/etc/recovery.fstab
          # Hapus baris mount system/cust(vendor) lama yang bersifat statis
          sed -i '/\/by-name\/system\s\+\/system/d;/\/by-name\/cust\s\+\/vendor/d' "$RFSTAB"

          # Entri di bawah disalin persis dari rootdir/etc/fstab.qcom ROM
          # (Project-Nightcord/android_device_xiaomi_vince, lineage-22.2)
          cat >> "$RFSTAB" << 'EOF'
          system				/system			ext4	ro								wait,logical,first_stage_mount
          system				/system			erofs	ro								wait,logical,first_stage_mount
          system_ext			/system_ext		ext4	ro								wait,logical,first_stage_mount
          system_ext			/system_ext		erofs	ro								wait,logical,first_stage_mount
          product				/product		ext4	ro								wait,logical,first_stage_mount
          product				/product		erofs	ro								wait,logical,first_stage_mount
          vendor				/vendor			ext4	ro								wait,logical,first_stage_mount
          vendor				/vendor			erofs	ro								wait,logical,first_stage_mount
          odm				/odm			ext4	ro								wait,logical,first_stage_mount
          odm				/odm			erofs	ro								wait,logical,first_stage_mount
          EOF

          echo "== Hasil BoardConfig.mk (bagian akhir) =="
          tail -n 20 BoardConfig.mk
          echo "== Hasil twrp.fstab =="
          cat "$FSTAB"
          echo "== Hasil recovery.fstab (bagian akhir) =="
          tail -n 10 "$RFSTAB"

      - name: Increase Kernel/Recovery Log Verbosity (for debugging)
        run: |
          cd twrp/device/xiaomi/vince
          # Naikkan verbosity dmesg kernel supaya error mount dynamic partition
          # (liblp/fs_mgr) kelihatan jelas lewat `adb shell dmesg` saat di recovery.
          # Ini cuma nambah opsi di cmdline (dibakar ke header boot image saat
          # mkbootimg), TIDAK perlu rebuild kernel.
          sed -i 's/^BOARD_KERNEL_CMDLINE := /BOARD_KERNEL_CMDLINE := printk.devkmsg=on loglevel=8 /' BoardConfig.mk
          grep "^BOARD_KERNEL_CMDLINE" BoardConfig.mk

          # Pastikan logcat & logd aktif (dibutuhkan supaya `adb shell logcat`
          # bisa dipakai buat lihat error mount/init dari recovery)
          grep -q "^TWRP_INCLUDE_LOGCAT" BoardConfig.mk || echo "TWRP_INCLUDE_LOGCAT := true" >> BoardConfig.mk
          grep -q "^TARGET_USES_LOGD" BoardConfig.mk || echo "TARGET_USES_LOGD := true" >> BoardConfig.mk

      - name: Extra Cleanup Before Build
        run: |
          cd twrp
          # Buang project yang nggak perlu buat recovery-only image (bukan full ROM)
          rm -rf prebuilts/qemu-kernel 2>/dev/null || true
          rm -rf prebuilts/android-emulator 2>/dev/null || true
          rm -rf test 2>/dev/null || true
          rm -rf cts 2>/dev/null || true
          rm -rf pdk 2>/dev/null || true
          # Bersihkan sisa apt & docker & tmp yang mungkin masih numpuk
          sudo apt-get clean 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
          df -h

      - name: Check Disk Space (before compile)
        run: df -h

      - name: Show Biggest Folders (debug)
        working-directory: twrp
        run: |
          echo "== Top 15 folder terbesar di twrp/ =="
          du -h --max-depth=1 . 2>/dev/null | sort -rh | head -15
          echo ""
          echo "== Total ukuran twrp/ =="
          du -sh . 2>/dev/null

      - name: Notify Telegram - Compiling
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="⚙️ *Compiling TWRP (Dynamic Partition)...*
            📱 *Target:* twrp_vince-eng
            🧵 *Threads:* $(nproc --all) cores
            🔨 Build sedang berjalan, harap tunggu..."

      - name: Start Disk Monitor (background)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          # Log df -h tiap 2 menit ke file terpisah, supaya kalau build mati
          # karena disk penuh, kita tau PERSIS di menit keberapa & secepat apa
          # disk terisi -- bukan cuma "abis di akhir". Kalau usage sudah >85%,
          # kirim notif Telegram (cuma sekali, biar nggak spam).
          (
            ALERTED=false
            while true; do
              echo "=== $(date +%H:%M:%S) ===" >> /tmp/disk_monitor.log
              df -h >> /tmp/disk_monitor.log
              echo "" >> /tmp/disk_monitor.log

              USAGE=$(df / | tail -1 | awk '{print $5}' | tr -d '%')
              AVAIL=$(df -h / | tail -1 | awk '{print $4}')

              if [ "$USAGE" -ge 85 ] && [ "$ALERTED" = false ]; then
                ALERTED=true
                curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
                  -d chat_id="${TG_CHAT_ID}" \
                  -d parse_mode="Markdown" \
                  -d text="⚠️ *Disk Space Kritis!*
              💾 Terpakai: ${USAGE}% (sisa: ${AVAIL})
              🕒 $(date +%H:%M:%S)
              📱 Build TWRP vince masih jalan, kemungkinan bakal gagal karena disk penuh."
              fi

              sleep 120
            done
          ) &
          echo "DISK_MONITOR_PID=$!" >> $GITHUB_ENV

      - name: Check if assemble_vintf blocks recoveryimage target
        working-directory: twrp
        run: |
          # Cek dulu apakah assemble_vintf benar-benar dependency WAJIB untuk
          # target 'recoveryimage', atau cuma ke-trigger karena ninja build
          # banyak target sekaligus. TWRP recovery.img secara historis TIDAK
          # butuh VINTF assembly (itu fitur Treble/GSI compliance check,
          # bukan komponen boot recovery).
          echo "Mencari referensi assemble_vintf di makefile recovery target..."
          grep -rn "assemble_vintf" build/make/core/*.mk 2>/dev/null | grep -i recovery || echo "Tidak ada referensi langsung assemble_vintf -> recoveryimage di core makefile"
        working-directory: twrp
        env:
          KBUILD_BUILD_USER: "RahmatSobrian"
          KBUILD_BUILD_HOST: "ReLIFE"
        run: |
          mkdir -p logs
          export ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_BROKEN_MISSING_REQUIRED_MODULES=true
          export SOONG_ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          set +e
          . build/envsetup.sh
          set -e

          if ! type lunch &>/dev/null; then
            echo "❌ lunch not found" | tee -a /tmp/full_build.log
            exit 1
          fi

          lunch twrp_vince-eng
          if [ $? -ne 0 ]; then
            echo "❌ lunch failed" | tee -a /tmp/full_build.log
            exit 1
          fi

          echo "TARGET_PRODUCT=$TARGET_PRODUCT" | tee -a /tmp/full_build.log
          echo "TARGET_DEVICE=$TARGET_DEVICE" | tee -a /tmp/full_build.log

          if [ "$TARGET_PRODUCT" != "twrp_vince" ]; then
            echo "❌ TARGET_PRODUCT salah: $TARGET_PRODUCT" | tee -a /tmp/full_build.log
            exit 1
          fi

          mka -j$(nproc --all) recoveryimage 2>&1 | tee logs/build.txt | tee -a /tmp/full_build.log

      - name: Stop Disk Monitor & Save Log
        if: always()
        run: |
          kill "$DISK_MONITOR_PID" 2>/dev/null || true
          echo "=== FINAL $(date +%H:%M:%S) ===" >> /tmp/disk_monitor.log
          df -h >> /tmp/disk_monitor.log
          mkdir -p twrp/debug-info
          cp /tmp/disk_monitor.log twrp/debug-info/disk_monitor.log 2>/dev/null || true

      - name: Check Disk Space (after compile)
        if: always()
        run: df -h

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: twrp/logs/build.txt

      - name: Collect Debug Info (final fstab & config actually embedded)
        if: always()
        working-directory: twrp
        run: |
          mkdir -p debug-info
          OUT=out/target/product/vince/recovery/root/system/etc
          # File FINAL yang beneran masuk ramdisk recovery, buat dibandingkan
          # sama file yang kita patch manual - kalau beda, artinya ada step
          # build system yang overwrite/generate ulang.
          cp -v "$OUT/twrp.fstab" debug-info/twrp.fstab.final 2>/dev/null || echo "twrp.fstab.final: tidak ditemukan (build mungkin gagal sebelum tahap ini)" > debug-info/twrp.fstab.final
          cp -v "$OUT/recovery.fstab" debug-info/recovery.fstab.final 2>/dev/null || echo "recovery.fstab.final: tidak ditemukan" > debug-info/recovery.fstab.final
          cp -v device/xiaomi/vince/BoardConfig.mk debug-info/BoardConfig.mk.used 2>/dev/null || true
          # Dump partition table via lpdump kalau tool-nya ada di out (opsional, best-effort)
          echo "Build finished at $(date)" > debug-info/build-meta.txt
          echo "TARGET_PRODUCT=twrp_vince" >> debug-info/build-meta.txt

      - name: Upload Debug Info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-vince-dynamic-debug-info
          path: twrp/debug-info
        continue-on-error: true

      - name: Upload recovery.img
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-vince-dynamic-recovery
          path: twrp/out/target/product/vince/recovery.img

      - name: Upload TWRP zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-vince-dynamic-zip
          path: twrp/out/target/product/vince/twrp*.zip
        continue-on-error: true

      - name: Notify Telegram - Build Success
        if: success()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          BUILD_DATE=$(date +"%Y-%m-%d %H:%M:%S UTC")
          IMG_SIZE=$(du -sh twrp/out/target/product/vince/recovery.img 2>/dev/null | cut -f1 || echo "N/A")
          DISK_FINAL=$(df -h / | tail -1 | awk '{print "Terpakai "$5" (sisa "$4")"}')
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="✅ *TWRP Build Sukses! (Dynamic Partition)*
            📱 *Device:* Xiaomi Redmi 5 Plus (vince) - mi8953
            🌿 *Branch:* android-12.1 (patched)
            📦 *Image Size:* ${IMG_SIZE}
            💾 *Disk saat selesai:* ${DISK_FINAL}
            🕒 *Selesai:* ${BUILD_DATE}
            📥 Artifacts: \`recovery.img\` • \`twrp-*.zip\` • \`build.txt\` • \`disk_monitor.log\`
            🔗 [Download](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            🎉 *TWRP dynamic partition untuk vince berhasil di-build!*"

      - name: Upload Full Log to Telegram on Failure
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          mkdir -p twrp/logs
          cat /tmp/full_build.log >> twrp/logs/build.txt 2>/dev/null || true

          LOG_FILE="twrp/logs/build.txt"
          if [ ! -f "$LOG_FILE" ]; then
            LOG_FILE="/tmp/full_build.log"
          fi

          if [ -f "$LOG_FILE" ]; then
            FILE_SIZE=$(du -m "$LOG_FILE" | cut -f1)
            if [ "$FILE_SIZE" -gt 45 ]; then
              gzip -k "$LOG_FILE"
              curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
                -F chat_id="${TG_CHAT_ID}" \
                -F document=@"${LOG_FILE}.gz" \
                -F caption="📄 Full build log (compressed) - TWRP vince dynamic (FAILED)"
            else
              curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
                -F chat_id="${TG_CHAT_ID}" \
                -F document=@"${LOG_FILE}" \
                -F caption="📄 Full build log - TWRP vince dynamic (FAILED)"
            fi
          fi

      - name: Send Disk Monitor Log to Telegram on Failure
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -f /tmp/disk_monitor.log ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TG_CHAT_ID}" \
              -F document=@/tmp/disk_monitor.log \
              -F caption="💾 Disk usage log tiap 2 menit selama build (TWRP vince, FAILED)"
          fi

      - name: Notify Telegram - Build Failed
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          BUILD_DATE=$(date +"%Y-%m-%d %H:%M:%S UTC")
          DISK_FINAL=$(df -h / | tail -1 | awk '{print "Terpakai "$5" (sisa "$4")"}' 2>/dev/null || echo "N/A")
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="❌ *TWRP Build GAGAL! (Dynamic Partition)*
            📱 *Device:* Xiaomi Redmi 5 Plus (vince) - mi8953
            🌿 *Branch:* android-12.1 (patched)
            💾 *Disk saat gagal:* ${DISK_FINAL}
            🕒 *Waktu:* ${BUILD_DATE}
            📄 Full log & disk_monitor.log sudah dikirim/tersedia di artifacts.
            🔗 [Lihat Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
