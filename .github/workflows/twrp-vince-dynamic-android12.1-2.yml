      - name: Patch Device Tree - Retrofit Dynamic Partition
        run: |
          set -e

          cd twrp/device/xiaomi/vince

          echo "========================================"
          echo " PATCH DEVICE TREE"
          echo "========================================"

          # ----------------------------------------------------------
          # Pastikan direktori tujuan fstab & flags sudah ada
          # ----------------------------------------------------------
          mkdir -p recovery/root/system/etc
          mkdir -p recovery/root/system/bin

          # ----------------------------------------------------------
          # Remove conflicting static partition definitions
          # ----------------------------------------------------------

          sed -i \
            '/^BOARD_SYSTEMIMAGE_PARTITION_SIZE/d;
             /^BOARD_VENDORIMAGE_PARTITION_SIZE/d;
             /^BOARD_VENDORIMAGE_FILE_SYSTEM_TYPE/d;
             /^BOARD_SUPER_PARTITION_BLOCK_DEVICES/d;
             /^BOARD_SUPER_PARTITION_METADATA_DEVICE/d;
             /^BOARD_SUPER_PARTITION_CUST_DEVICE_SIZE/d;
             /^BOARD_SUPER_PARTITION_SYSTEM_DEVICE_SIZE/d;
             /^BOARD_SUPER_PARTITION_SIZE/d;
             /^BOARD_SUPER_PARTITION_GROUPS/d;
             /^BOARD_MI8953_DYNPART_SIZE/d;
             /^BOARD_MI8953_DYNPART_PARTITION_LIST/d;
             /^TARGET_COPY_OUT_PRODUCT/d;
             /^TARGET_COPY_OUT_SYSTEM_EXT/d;
             /^TARGET_COPY_OUT_VENDOR/d;
             /^TARGET_COPY_OUT_ODM/d;
             /^BOARD_PRODUCTIMAGE_FILE_SYSTEM_TYPE/d;
             /^BOARD_SYSTEM_EXTIMAGE_FILE_SYSTEM_TYPE/d;
             /^BOARD_ODMIMAGE_FILE_SYSTEM_TYPE/d;
             /^TW_INCLUDE_LOGICAL/d' \
            BoardConfig.mk

          # ----------------------------------------------------------
          # Retrofit Dynamic Partition configuration
          # ----------------------------------------------------------

          cat >> BoardConfig.mk << 'EOF'

          # ============================================================
          # RETROFIT DYNAMIC PARTITION - vince / mi8953
          # ============================================================

          BOARD_SUPER_PARTITION_BLOCK_DEVICES := cust system
          BOARD_SUPER_PARTITION_METADATA_DEVICE := system

          BOARD_SUPER_PARTITION_CUST_DEVICE_SIZE := 536870912
          BOARD_SUPER_PARTITION_SYSTEM_DEVICE_SIZE := 3221225472

          BOARD_SUPER_PARTITION_SIZE := $(shell expr $(BOARD_SUPER_PARTITION_CUST_DEVICE_SIZE) + $(BOARD_SUPER_PARTITION_SYSTEM_DEVICE_SIZE))

          BOARD_SUPER_PARTITION_GROUPS := mi8953_dynpart

          BOARD_MI8953_DYNPART_SIZE := $(shell expr $(BOARD_SUPER_PARTITION_SIZE) - 4194304)

          BOARD_MI8953_DYNPART_PARTITION_LIST := \
              product \
              system \
              system_ext \
              odm \
              vendor

          TARGET_COPY_OUT_PRODUCT := product
          TARGET_COPY_OUT_SYSTEM_EXT := system_ext
          TARGET_COPY_OUT_VENDOR := vendor
          TARGET_COPY_OUT_ODM := odm

          BOARD_PRODUCTIMAGE_FILE_SYSTEM_TYPE := ext4
          BOARD_SYSTEM_EXTIMAGE_FILE_SYSTEM_TYPE := ext4
          BOARD_VENDORIMAGE_FILE_SYSTEM_TYPE := ext4
          BOARD_ODMIMAGE_FILE_SYSTEM_TYPE := ext4

          TW_INCLUDE_LOGICAL := true

          EOF

          # ========================================================
          # TWRP FSTAB
          # ========================================================

          FSTAB="recovery/root/system/etc/twrp.fstab"

          echo "===== ORIGINAL TWRP FSTAB ====="

          if [ -f "$FSTAB" ]; then
            cat "$FSTAB"
          else
            echo "WARNING: $FSTAB tidak ditemukan"
            touch "$FSTAB"
          fi

          # Hapus entry static yang bentrok
          sed -i \
            '/^\/system[[:space:]]/d;
             /^\/system_image[[:space:]]/d;
             /^\/vendor[[:space:]]/d;
             /^\/vendor_image[[:space:]]/d;
             /^\/product[[:space:]]/d;
             /^\/system_ext[[:space:]]/d;
             /^\/odm[[:space:]]/d' \
            "$FSTAB"

          echo "===== PATCHED TWRP FSTAB ====="

          cat "$FSTAB"

          # ========================================================
          # RECOVERY FSTAB
          # ========================================================

          RFSTAB="recovery/root/system/etc/recovery.fstab"

          if [ -f "$RFSTAB" ]; then

            sed -i \
              '/\/by-name\/system[[:space:]]\+\/system/d;
               /\/by-name\/cust[[:space:]]\+\/vendor/d;
               /\/by-name\/system[[:space:]]\+\/system_root/d' \
              "$RFSTAB"

          else

            touch "$RFSTAB"

          fi

          # ========================================================
          # DYNAMIC TWRP FLAGS
          # ========================================================

          cat > recovery/root/system/etc/twrp.flags.dynpart << 'EOF'
          # ============================================================
          # VINCE RETROFIT DYNAMIC PARTITION
          # ============================================================

          /data ext4 /dev/block/bootdevice/by-name/userdata flags=encryptable=footer;fsflags="discard"

          /metadata ext4 /dev/block/bootdevice/by-name/logdump flags=display="Metadata";fsflags="discard"

          EOF

          # ========================================================
          # NON-DYNAMIC FALLBACK
          # ========================================================

          cat > recovery/root/system/etc/twrp.flags.nondynpart << 'EOF'
          # ============================================================
          # VINCE STATIC PARTITION FALLBACK
          # ============================================================

          /system_root ext4 /dev/block/bootdevice/by-name/system flags=display="System";fsflags="discard";wipeingui

          /system_image emmc /dev/block/bootdevice/by-name/system flags=display="System";backup=1;flashimg=1

          /vendor ext4 /dev/block/bootdevice/by-name/cust flags=display="Vendor";fsflags="discard";wipeingui

          /vendor_image emmc /dev/block/bootdevice/by-name/cust flags=display="Vendor";backup=1;flashimg=1

          /data ext4 /dev/block/bootdevice/by-name/userdata flags=encryptable=footer;fsflags="discard"

          /metadata ext4 /dev/block/bootdevice/by-name/logdump flags=display="Metadata";fsflags="discard"

          EOF
